name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test

  integration:
    name: Integration (Euro-Office assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache Euro-Office assets
        uses: actions/cache@v4
        id: assets-cache
        with:
          path: assets
          key: euro-office-assets-v3-${{ hashFiles('scripts/euro-office.version') }}
      - name: Prepare assets
        run: make ensure-assets
      - name: Integration tests
        env:
          GO_OFFICE_ASSETS: ${{ github.workspace }}/assets
        run: make test-integration

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache Euro-Office assets
        uses: actions/cache@v4
        id: assets-cache
        with:
          path: assets
          key: euro-office-assets-v3-${{ hashFiles('scripts/euro-office.version') }}
      - name: Prepare assets
        run: make ensure-assets
      - name: Verify sample matrix
        run: make check-sample-matrix
      - name: Playwright E2E
        env:
          GO_OFFICE_ASSETS: ${{ github.workspace }}/assets
        run: make test-playwright
