name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  integration:
    name: Integration (Euro-Office assets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache Euro-Office assets
        uses: actions/cache@v4
        id: assets-cache
        with:
          path: assets
          key: euro-office-assets-v5-amd64-${{ hashFiles('scripts/euro-office.version') }}
      - name: Prepare assets
        run: make ensure-assets
      - name: Integration tests
        env:
          OFFICE_ASSETS: ${{ github.workspace }}/assets
        run: make test-integration

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache Euro-Office assets
        uses: actions/cache@v4
        id: assets-cache
        with:
          path: assets
          key: euro-office-assets-v5-arm64-${{ hashFiles('scripts/euro-office.version') }}
      - name: Prepare assets
        run: make ensure-assets
      - name: Verify sample matrix
        run: make check-sample-matrix
      - name: Playwright E2E
        env:
          OFFICE_ASSETS: ${{ github.workspace }}/assets
        run: make test-playwright
