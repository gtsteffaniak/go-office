name: main release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  push_main_image:
    name: Push main image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Euro-Office version
        id: euro
        run: |
          set -a
          # shellcheck disable=SC1091
          . ./scripts/euro-office.version
          set +a
          echo "version=${EURO_OFFICE_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gtsteffaniak/office-server
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.euro.outputs.version }}

      - name: Resolve incrementing version tag
        id: versions
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/gtsteffaniak/office-server"
          REPO="gtsteffaniak/office-server"
          V="${{ steps.euro.outputs.version }}"
          token=$(curl -fsSL -u "${REGISTRY_USER}:${REGISTRY_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${REPO}:pull" | jq -r .token)
          existing=$(curl -fsSL -H "Authorization: Bearer ${token}" \
            "https://ghcr.io/v2/${REPO}/tags/list?n=1000" | jq -r '.tags // [] | .[]')
          tags="${IMAGE}:latest,${IMAGE}:${V}"
          if printf '%s\n' "$existing" | grep -qxF "$V"; then
            last=$(printf '%s\n' "$existing" | awk -v p="${V}-" \
              'index($0,p)==1 && substr($0,length(p)+1) ~ /^[0-9]+$/ {n=substr($0,length(p)+1)+0; if(n>m) m=n} END{print m+0}')
            next=$((last + 1))
            tags="${tags},${IMAGE}:${V}-${next}"
            echo "::notice::${V} already exists; adding increment tag ${V}-${next}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./_docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.versions.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
