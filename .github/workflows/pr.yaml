name: PR

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare_assets:
    name: Prepare Euro-Office assets
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache Euro-Office assets
        uses: actions/cache@v4
        with:
          path: assets
          key: euro-office-assets-v7-arm64-${{ hashFiles('scripts/euro-office.version', 'internal/assetfetch/**', 'cmd/fetch-assets/**') }}
      - name: Fetch assets
        run: make ensure-assets
      - name: Upload assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: euro-office-assets
          path: assets/
          retention-days: 1
          if-no-files-found: error

  integration:
    name: Integration (Euro-Office assets)
    needs: prepare_assets
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Euro-Office assets
        uses: actions/download-artifact@v4
        with:
          name: euro-office-assets
          path: assets
      - name: Integration tests
        env:
          OFFICE_ASSETS: ${{ github.workspace }}/assets
        run: make test-integration

  convert-linux:
    name: Convert / x2t (Linux)
    needs: prepare_assets
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Download Euro-Office assets
        uses: actions/download-artifact@v4
        with:
          name: euro-office-assets
          path: assets
      - name: Convert tests
        env:
          OFFICE_ASSETS: ${{ github.workspace }}/assets
        run: make test-convert-linux

  test_playwright:
    name: Playwright - ${{ matrix.name }}
    needs: prepare_assets
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            project: chromium
          - name: save
            project: chromium-save
          - name: rtf
            project: chromium-rtf
          - name: post-save
            project: chromium-post-save
    steps:
      - uses: actions/checkout@v4
      - name: Download Euro-Office assets
        uses: actions/download-artifact@v4
        with:
          name: euro-office-assets
          path: assets
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify sample matrix
        run: make check-sample-matrix
      - name: Build go-office binary
        run: GOOS=linux go build -o bin/go-office ./cmd/go-office
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Playwright E2E
        env:
          CI: true
          OFFICE_ASSETS: ${{ github.workspace }}/assets
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
          REPO_ROOT: ${{ github.workspace }}
          OFFICE_DEBUG_LOGGING: "1"
          OFFICE_POLL_HOLD: "0"
          OFFICE_SAVE_DELAY: 500ms
          PLAYWRIGHT_SAVE_DONE_TIMEOUT: "30000"
          PLAYWRIGHT_SAVE_TEST_TIMEOUT: "150000"
          PLAYWRIGHT_RTF_TEST_TIMEOUT: "240000"
          PLAYWRIGHT_WARM_TIMEOUT: "60000"
          PLAYWRIGHT_WARM_REQUEST_MS: "30000"
          PLAYWRIGHT_PREWARM_DEADLINE_MS: "60000"
          PLAYWRIGHT_PREWARM_REQUEST_MS: "20000"
          PLAYWRIGHT_ACTION_TIMEOUT: "45000"
          PLAYWRIGHT_EDITOR_TIMEOUT: "45000"
          PLAYWRIGHT_STRICT: "1"
          PLAYWRIGHT_FAIL_FAST_SAVE: "1"
        run: ./scripts/run-playwright.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ matrix.name }}
          path: |
            frontend/playwright-report
            frontend/test-results
            server.log
          retention-days: 7

  docker-build:
    name: Docker image build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/quantumx-apps/office-server
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./_docker/Dockerfile
          push: false
          build-args: |
            SKIP_ASSET_FETCH=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
