name: PR

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  integration:
    name: Integration (Euro-Office assets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          cache: true
      - name: Cache Euro-Office assets
        uses: actions/cache@v4
        with:
          path: assets
          key: euro-office-assets-v6-amd64-${{ hashFiles('scripts/euro-office.version') }}
      - name: Prepare assets
        run: make ensure-assets
      - name: Integration tests
        env:
          OFFICE_ASSETS: ${{ github.workspace }}/assets
        run: make test-integration

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          cache: true
      - name: Cache Euro-Office assets
        uses: actions/cache@v4
        with:
          path: assets
          key: euro-office-assets-v6-arm64-${{ hashFiles('scripts/euro-office.version') }}
      - name: Prepare assets
        run: make ensure-assets
      - name: Verify sample matrix
        run: make check-sample-matrix
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Playwright E2E
        env:
          OFFICE_ASSETS: ${{ github.workspace }}/assets
        run: make test-playwright

  docker-build:
    name: Docker image build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          cache: true
      - name: Cache Euro-Office assets
        uses: actions/cache@v4
        with:
          path: assets
          key: euro-office-assets-v6-arm64-${{ hashFiles('scripts/euro-office.version') }}
      - name: Prepare assets
        run: mkdir -p assets && make ensure-assets
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/quantumx-apps/office-server
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./_docker/Dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
