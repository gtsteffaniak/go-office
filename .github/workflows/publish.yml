name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: GHCR office-server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Euro-Office assets
        uses: actions/cache@v4
        with:
          path: assets
          key: euro-office-assets-v5-${{ hashFiles('scripts/euro-office.version') }}

      - name: Prepare assets
        run: mkdir -p assets && make ensure-assets

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE: ghcr.io/quantumx-apps/office-server
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . ./scripts/euro-office.version
          set +a
          ver="${EURO_OFFICE_VERSION#v}"
          tags="${IMAGE}:latest,${IMAGE}:${ver}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags="${tags},${IMAGE}:${GITHUB_REF#refs/tags/}"
          fi
          docker buildx build \
            --push \
            --file _docker/Dockerfile \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${ver}" \
            $(if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then echo --tag "${IMAGE}:${GITHUB_REF#refs/tags/}"; fi) \
            .
