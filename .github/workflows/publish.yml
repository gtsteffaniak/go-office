name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: GHCR office-server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Euro-Office assets
        uses: actions/cache@v4
        with:
          path: assets
          key: euro-office-assets-v5-${{ hashFiles('scripts/euro-office.version') }}

      - name: Prepare assets
        run: mkdir -p assets && make ensure-assets

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE: ghcr.io/quantumx-apps/office-server
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . ./scripts/euro-office.version
          set +a
          euro_ver="${EURO_OFFICE_VERSION#v}"
          tags=(--tag "${IMAGE}:latest" --tag "${IMAGE}:${euro_ver}")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            go_tag="${GITHUB_REF#refs/tags/}"
            tags+=(--tag "${IMAGE}:${go_tag}")
          fi
          docker buildx build \
            --push \
            --file _docker/Dockerfile \
            "${tags[@]}" \
            .

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . ./scripts/euro-office.version
          set +a
          euro_ver="${EURO_OFFICE_VERSION#v}"
          go_tag="${GITHUB_REF#refs/tags/}"
          body_file="$(mktemp)"
          cat >"${body_file}" <<EOF
          ## go-office ${go_tag}

          **Euro-Office pin:** ${euro_ver}

          ### Docker

          Docker images are tagged with both Euro-Office and go-office versions:

          \`\`\`bash
          docker pull ghcr.io/quantumx-apps/office-server:${euro_ver}
          docker pull ghcr.io/quantumx-apps/office-server:${go_tag}
          \`\`\`

          ### Go module

          \`\`\`bash
          go get github.com/quantumx-apps/go-office@${go_tag}
          \`\`\`

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${go_tag}/CHANGELOG.md) for full release notes.
          EOF
          gh release create "${go_tag}" --title "go-office ${go_tag} (Euro-Office ${euro_ver})" --notes-file "${body_file}"
