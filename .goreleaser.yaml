# GoReleaser config for go-office CLI binaries (see .github/workflows/tag.yaml).
version: 2

project_name: go-office

before:
  hooks:
    - go mod download
    - go run ./cmd/gen-assets-version

builds:
  - id: go-office
    main: ./cmd/go-office
    binary: go-office
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: fetch-assets
    main: ./cmd/fetch-assets
    binary: fetch-assets
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: doctor
    main: ./cmd/doctor
    binary: go-office-doctor
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - scripts/euro-office.version

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  github:
    owner: quantumx-apps
    name: go-office
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
