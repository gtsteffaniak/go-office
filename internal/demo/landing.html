<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>go-office demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #f4f4f4;
      color: #222;
    }
    main {
      max-width: 52rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.6rem; }
    p { margin: 0 0 1.5rem; color: #555; }
    code { background: #e8e8e8; padding: 0.1rem 0.35rem; border-radius: 4px; }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }
    li + li { border-top: 1px solid #eee; }
    a {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.85rem 1rem;
      color: #0b57d0;
      text-decoration: none;
    }
    a:hover { background: #f7faff; }
    .thumb {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #ddd;
      background: #fafafa;
      flex-shrink: 0;
    }
    .row-text {
      display: flex;
      flex: 1;
      justify-content: space-between;
      gap: 1rem;
      min-width: 0;
    }
    .row-text span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meta { color: #777; font-size: 0.9rem; white-space: nowrap; }
    .empty { padding: 1rem; color: #777; }
  </style>
</head>
<body>
  <main>
    <h1>go-office demo</h1>
    <p>Documents in <code>{{.SamplesDir}}</code>. Choose a file to open in the editor.</p>
    {{if .Files}}
    <ul>
      {{range .Files}}
      <li>
        <a href="{{.URL}}">
          <img class="thumb" src="{{.ThumbnailURL}}" alt="" loading="lazy" data-sample-thumb />
          <span class="row-text">
            <span>{{.Name}}</span>
            <span class="meta">{{.Size}}</span>
          </span>
        </a>
      </li>
      {{end}}
    </ul>
    {{else}}
    <p class="empty">No supported documents found. Add files under <code>{{.SamplesDir}}</code>.</p>
    {{end}}
  </main>
</body>
</html>
