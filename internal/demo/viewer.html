<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>go-office demo</title>
  <link rel="preload" href="{{.APIScriptURL}}" as="script" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #f4f4f4; }
    header {
      padding: 0.6rem 1rem;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    header code { background: #eee; padding: 0.1rem 0.35rem; border-radius: 4px; }
    header a { color: #0b57d0; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    #editor { height: calc(100% - 48px); }
    #status { color: #555; font-size: 0.9rem; }
    #status.status-error { color: #b3261e; }
    #status.status-ok { color: #137333; }
  </style>
  <script id="office-api" type="text/javascript"></script>
</head>
<body>
  <header>
    <a href="{{.LandingURL}}">← Documents</a>
    <strong id="doc-title">go-office demo</strong>
    <span id="status">Loading…</span>
    <span>File: <code id="sample-path"></code></span>
  </header>
  <div id="editor"></div>
  <script>
    var SAMPLE_FILE = {{.FileJSON}};
    var DOCUMENT_KEY = {{.DocumentKeyJSON}};
    var officeBase = {{.OfficeBaseJSON}};
    var apiBase = {{.APIBaseJSON}};
    // UI mount prefix that served this page ("/demo" or "/example"); used for viewer
    // sub-resource calls so both aliases work identically.
    var uiBase = {{.UIBaseJSON}};
    var landingURL = {{.LandingURLJSON}};

    document.getElementById("sample-path").textContent = SAMPLE_FILE;

    var statusEl = document.getElementById("status");
    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = kind === "error" ? "status-error" : (kind === "ok" ? "status-ok" : "");
    }

    function joinPath(base, path) {
      if (!base) {
        return path;
      }
      return base.replace(/\/$/, "") + "/" + path.replace(/^\//, "");
    }

    var autosavePollTimer = null;
    var saveWatchdogTimer = null;
    // Highest server save sequence observed; used to tell "a newer flush settled" from
    // "the same older flush is still the latest".
    var lastSaveSequence = 0;
    // Server-driven save verification. The viewer polls the document server's authoritative
    // last-flush outcome (/demo/savestate) instead of hashing the file on disk. Disk hashing
    // could not distinguish "persisted but still being served from a stale cache" from
    // "not persisted", and it only ever surfaced failures after a long timeout.
    //
    // SAVE_VERIFY_MS is the backstop for a flush that never settles at all; a real flush
    // reports success or failure within this window and the client reacts immediately.
    var SAVE_VERIFY_MS = 120000;
    var SAVE_POLL_INTERVAL_MS = 250;
    var SAVE_POLL_MAX_ATTEMPTS = Math.ceil(SAVE_VERIFY_MS / SAVE_POLL_INTERVAL_MS);

    function demoFileUrl() {
      return joinPath(apiBase, "/demo/file/" + encodeURIComponent(SAMPLE_FILE));
    }

    function demoSaveStateUrl() {
      return joinPath(apiBase, "/demo/savestate?file=" + encodeURIComponent(SAMPLE_FILE));
    }

    function fetchSaveState() {
      return fetch(demoSaveStateUrl(), { cache: "no-store" }).then(function (res) {
        if (!res.ok) {
          throw new Error("savestate " + res.status);
        }
        return res.json();
      });
    }

    function clearSaveWatchdog() {
      if (saveWatchdogTimer) {
        clearTimeout(saveWatchdogTimer);
        saveWatchdogTimer = null;
      }
    }

    function markSaveDone() {
      clearSaveWatchdog();
      document.body.setAttribute("data-save-done", String(Date.now()));
      document.body.removeAttribute("data-dirty");
      document.body.removeAttribute("data-saving");
      document.body.removeAttribute("data-save-error");
      setStatus("Saved", "ok");
    }

    function beginSaveWatchdog() {
      clearSaveWatchdog();
      saveWatchdogTimer = setTimeout(function () {
        if (document.body.hasAttribute("data-dirty")) {
          markSaveError("changes were not stored on the server");
        }
      }, SAVE_VERIFY_MS + 5000);
    }

    function markSaveError(msg) {
      document.body.setAttribute("data-save-error", msg);
      document.body.removeAttribute("data-saving");
      setStatus("Error: " + msg, "error");
    }

    // Poll the server's save outcome until a flush settles after the given baseline
    // sequence. A reported failure is surfaced immediately rather than waiting out the
    // watchdog, so tests fail fast instead of hanging.
    function pollSaveComplete(requireNewerSequence) {
      if (autosavePollTimer) {
        clearTimeout(autosavePollTimer);
      }
      document.body.setAttribute("data-saving", "true");
      document.body.removeAttribute("data-save-error");
      var attempts = 0;
      var baseline = lastSaveSequence;
      var needNewer = requireNewerSequence !== false;
      function tick() {
        attempts += 1;
        fetchSaveState()
          .then(function (state) {
            if (state && state.known && (!needNewer || state.sequence > baseline)) {
              lastSaveSequence = state.sequence;
              clearSaveWatchdog();
              if (!state.success) {
                markSaveError(state.error || "server failed to store the document");
                return;
              }
              markSaveDone();
              return;
            }
            if (attempts < SAVE_POLL_MAX_ATTEMPTS) {
              autosavePollTimer = setTimeout(tick, SAVE_POLL_INTERVAL_MS);
              return;
            }
            clearSaveWatchdog();
            if (document.body.hasAttribute("data-dirty")) {
              markSaveError("server did not report a saved document in time");
            } else {
              document.body.removeAttribute("data-saving");
            }
          })
          .catch(function () {
            if (attempts < SAVE_POLL_MAX_ATTEMPTS) {
              autosavePollTimer = setTimeout(tick, SAVE_POLL_INTERVAL_MS);
            } else {
              clearSaveWatchdog();
              markSaveError("could not read server save state");
            }
          });
      }
      autosavePollTimer = setTimeout(tick, 100);
    }

    // reconcileSaveState resolves save status after the editor reports the document clean.
    // The flush may already have settled, in which case the latest recorded outcome is the
    // answer, so accept it without requiring a newer sequence.
    function reconcileSaveState() {
      pollSaveComplete(false);
    }

    function warmDocument() {
      document.body.removeAttribute("data-warm-done");
      document.body.removeAttribute("data-warm-error");
      var warmUrl = joinPath(officeBase, uiBase + "/warm?file=" + encodeURIComponent(SAMPLE_FILE));
      return fetch(warmUrl, { cache: "no-store" })
        .then(function (res) {
          if (!res.ok) {
            return res.text().then(function (body) {
              throw new Error("warm HTTP " + res.status + (body ? ": " + body : ""));
            });
          }
          document.body.setAttribute("data-warm-done", "true");
          document.body.removeAttribute("data-warm-error");
        })
        .catch(function (err) {
          var msg = err && err.message ? String(err.message) : "warm request failed";
          document.body.setAttribute("data-warm-error", msg);
          document.body.removeAttribute("data-warm-done");
        });
    }

    function loadEditor() {
      var apiScript = document.getElementById("office-api");
      apiScript.onerror = function () {
        setStatus("Failed to load api.js — fetch Euro-Office assets first (see README)", "error");
      };
      apiScript.onload = function () {
        var configUrl = joinPath(apiBase, "/demo/config?file=" + encodeURIComponent(SAMPLE_FILE));
        setStatus("Loading config…");
        fetch(configUrl, { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("config " + res.status);
            return res.json();
          })
          .then(function (config) {
            document.getElementById("doc-title").textContent = config.document.title;
            setStatus("Opening " + config.document.title + "…");
            var baseEvents = config.events || {};
            var documentReady = false;
            config.events = {
              onDocumentReady: function () {
                documentReady = true;
                document.body.setAttribute("data-document-ready", "true");
                setStatus("Document ready", "ok");
                // Seed the save sequence baseline so a flush that completed before this
                // viewer loaded is not mistaken for the current save.
                fetchSaveState()
                  .then(function (state) {
                    if (state && state.known) {
                      lastSaveSequence = state.sequence;
                    }
                  })
                  .catch(function () { /* baseline optional */ });
                if (typeof baseEvents.onDocumentReady === "function") {
                  baseEvents.onDocumentReady();
                }
              },
              onDocumentStateChange: function (event) {
                if (event && event.data === true) {
                  document.body.setAttribute("data-dirty", "true");
                  document.body.removeAttribute("data-save-done");
                  clearSaveWatchdog();
                  setStatus("Unsaved changes");
                } else if (event && event.data === false) {
                  clearSaveWatchdog();
                  if (autosavePollTimer) {
                    clearTimeout(autosavePollTimer);
                    autosavePollTimer = null;
                  }
                  // The editor reports the document is clean, i.e. it has flushed its changes
                  // to the server. Reconcile against the authoritative save state instead of
                  // requiring a strictly *newer* sequence: the flush can settle before this
                  // handler runs, and demanding a greater sequence would then never resolve.
                  document.body.removeAttribute("data-save-done");
                  document.body.removeAttribute("data-save-error");
                  setStatus("Saving…");
                  beginSaveWatchdog();
                  reconcileSaveState();
                }
                if (typeof baseEvents.onDocumentStateChange === "function") {
                  baseEvents.onDocumentStateChange(event);
                }
              },
              onError: function (event) {
                var detail = event && event.data;
                var code = event && event.code;
                var msg = "Editor error";
                if (detail != null && detail !== "") {
                  msg = String(detail);
                } else if (code != null) {
                  msg = "error code " + code;
                }
                setStatus("Error: " + msg, "error");
                console.error("editor onError", { code: code, data: detail, event: event });
                if (typeof baseEvents.onError === "function") {
                  baseEvents.onError(event);
                }
              },
            };
            setStatus("Loading document…");
            window.docEditor = new DocsAPI.DocEditor("editor", config);
            if (documentReady) {
              setStatus("Document ready", "ok");
            }
          })
          .catch(function (err) {
            setStatus("Error: " + err.message, "error");
            console.error(err);
          });
      };
      apiScript.src = joinPath(officeBase, "/web-apps/apps/api/documents/api.js");
    }

    function boot() {
      function start() {
        warmDocument().finally(loadEditor);
      }
      if (!("serviceWorker" in navigator)) {
        start();
        return;
      }
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) {
          return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
        })
        .then(start)
        .catch(function (err) {
          console.warn("service worker unregister failed", err);
          start();
        });
    }

    boot();

    function destroyDemoEditor() {
      var editor = window.docEditor;
      if (!editor) {
        return;
      }
      try {
        if (typeof editor.destroyEditor === "function") {
          editor.destroyEditor();
        }
      } catch (err) {
        console.warn("destroyEditor failed", err);
      }
      window.docEditor = null;
    }

    window.addEventListener("pagehide", destroyDemoEditor);
    window.addEventListener("beforeunload", destroyDemoEditor);
    document.addEventListener("click", function (event) {
      var link = event.target && event.target.closest ? event.target.closest("a[href]") : null;
      if (!link) {
        return;
      }
      var href = link.getAttribute("href") || "";
      if (href === "" || href.charAt(0) === "#") {
        return;
      }
      destroyDemoEditor();
    });
  </script>
</body>
</html>
